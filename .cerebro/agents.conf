# What each agent runs on: which tool, which model, how hard it thinks. Written by
# .cerebro/cerebro/scripts/install and edited by hand; .cerebro/cerebro/agents.conf.example is the shape.
# The most specific line wins whole: the agent's own name, then its role, then `default'.

default       tool=claude  model=opus  effort=medium
producer      tool=claude  model=sonnet  effort=medium
architect     tool=claude  model=fable  effort=medium
qa            tool=claude  model=fable  effort=medium

# Every other role runs on the default line. Uncomment one to give that role its own settings.
#default	      tool=copilot  model=claude-opus-5.5  effort=medium  
#ux            tool=copilot  model=claude-opus-5.5  effort=high
#architect     tool=copilot  model=gpt-6.1-sol      effort=high
#verifier      tool=claude   model=opus             effort=medium
#qa            tool=copilot  model=gpt-6.1-sol      effort=high

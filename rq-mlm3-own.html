<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Option C — a name keeps off its own dot only</title><style>
:root{--bg:#f4efe4;--fg:#2b2620;--muted:#6d655a;--card:#fffaf0;--line:#d9cfbd}
@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--fg:#ece5d8;--muted:#a59c8e;--card:#25221d;--line:#3a352d}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Georgia,serif;padding:20px 16px}
h1{font-size:20px;margin:0 0 4px} p.lede{color:var(--muted);margin:0 0 18px;max-width:760px}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
figcaption{font-size:13px;color:var(--muted);margin-top:8px;max-width:640px}
figcaption b{color:var(--fg)}
.pic{position:relative;overflow:hidden;border-radius:4px;background:#000}
.pic img{position:absolute;display:block}
.rect{position:absolute;border:1.5px dashed rgba(255,255,255,.55);pointer-events:none}
.ghost{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px dashed rgba(255,255,255,.8)}
.mark{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#ffd27a;box-shadow:0 0 8px 3px rgba(255,190,80,.85)}
.name{position:absolute;transform:translateY(-50%);white-space:nowrap;font:600 13px/1 system-ui,sans-serif;padding:4px 7px;border-radius:4px;background:rgba(20,18,14,.78);color:#f3ece0}
.name.person{color:#9cc8ff}
.lead{position:absolute;height:1.5px;background:rgba(255,230,180,.8);transform-origin:0 50%}
.btn{position:absolute;right:10px;bottom:10px;font:600 12px system-ui;padding:6px 10px;border-radius:14px;background:rgba(255,200,110,.95);color:#2a1c05}
.key{font-size:12px;color:var(--muted);margin-top:14px}
.key span{display:inline-flex;align-items:center;gap:6px;margin-right:16px}
.k1{width:10px;height:10px;border-radius:50%;background:#ffd27a;box-shadow:0 0 6px 2px rgba(255,190,80,.85)}
.k2{width:10px;height:10px;border-radius:50%;border:2px dashed #999}
.k3{width:16px;height:10px;border:1.5px dashed #999}

.plate{position:absolute;left:8px;right:8px;top:8px;background:#fffaf0;color:#2b2620;border:1px solid #d9cfbd;border-radius:8px;padding:8px 10px;font:13px/1.35 Georgia,serif;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.plate small{display:block;color:#6d655a;font-size:11px}.plate b{font-size:16px;display:block;margin:1px 0 5px}
.chip{display:inline-block;font:600 11px system-ui;padding:2px 7px;border-radius:10px;margin:0 4px 3px 0;background:#e3edf9;color:#24508a}
.chip.i{background:#e3f2e3;color:#2b6a2b}
.plate.see{opacity:.35}
.bar{position:absolute;left:0;right:0;bottom:0;height:52px;background:rgba(255,250,240,.96);border-top:1px solid #d9cfbd;font:600 12px system-ui;color:#2b2620;display:flex;align-items:center;justify-content:space-around}
.btn{bottom:62px}
.over{z-index:3}
.hint{position:absolute;font:11px system-ui;color:#ffe9b8}
.name{transform:none}.bad{outline:2px solid #ff5a5a}.tag{position:absolute;font:600 10px system-ui;color:#ff8a8a}</style><h1>Option C — a name keeps off its own dot only</h1><p class=lede>As filed. A name may still lie over a <i>neighbour's</i> dot (here Bread's name half-covers Table's dot). Fewer names move aside.</p><div class=row><figure><div class="pic" style="width:500px;height:350px"><img src="file:///Users/henrikku/repos/retroquest/web/public/images/generated/act1-eliors-cottage.png" style="width:620px;left:-60px;top:0"><div class="plate" style="right:auto;width:210px"><small>You are in</small><b>Elior's Cottage</b><span class="chip">Elior</span><span class="chip i">Bread</span><span class="chip i">Lantern</span></div><div class="bar"><span>Look</span><span>Take</span><span>Use</span><span>Talk</span></div><div class="mark" style="left:300px;top:222px"></div><div class="name " style="left:274.5px;top:191px">Table</div><div class="mark" style="left:300px;top:252px"></div><div class="name " style="left:274.5px;top:219px">Bread</div><div class="mark" style="left:150px;top:240px"></div><div class="name " style="left:124.5px;top:209px">Chair</div></div><figcaption><b>Two things close together.</b> Bread sits just under Table.</figcaption></figure></div>

name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_call:

permissions:
    contents: read

jobs:
    # Decides whether this run has anything to check. A pull request that only touches docs/
    # skips the checks below, and they still report success. Not `paths-ignore`, which would
    # leave the checks pending. Everything tests the answer against 'false', so a run where
    # this job fails or answers nothing checks everything.
    changes:
        runs-on: ubuntu-latest
        outputs:
            run: ${{ steps.decide.outputs.run }}
        steps:
            - uses: actions/checkout@v7
              with:
                  # A pull request is checked out as its merge commit; two commits are the
                  # whole diff.
                  fetch-depth: 2
                  sparse-checkout: .github

            - name: Decide whether the checks are needed
              id: decide
              env:
                  EVENT: ${{ github.event_name }}
              run: bash .github/scripts/ci-needed.sh "$EVENT" >> "$GITHUB_OUTPUT"

    web-lint:
        needs: changes
        if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npx eslint .

            - name: Format check
              run: npx prettier --check "src/**/*.{ts,vue}" "*.config.*"

    web-typecheck:
        needs: changes
        if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx vue-tsc --noEmit

    web-test:
        needs: changes
        if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test

    web-e2e:
        name: web-e2e (${{ matrix.shard }})
        needs: changes
        # The skip is on the steps: a skipped matrix job reports one check under the unexpanded
        # name, and the three shard checks would never arrive.
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: ["1/3", "2/3", "3/3"]
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v7
              if: needs.changes.outputs.run != 'false'

            - name: Set up Node.js
              if: needs.changes.outputs.run != 'false'
              uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              if: needs.changes.outputs.run != 'false'
              run: npm ci

            - name: Install Playwright browsers
              if: needs.changes.outputs.run != 'false'
              run: bash ../.github/scripts/install-playwright.sh

            - name: Run E2E tests (shard ${{ matrix.shard }})
              if: needs.changes.outputs.run != 'false'
              run: npx playwright test --shard=${{ matrix.shard }} --grep-invert @quarantine

    # Flaky tests set aside until their bead fixes them: tagged @quarantine, they still run
    # here, and a failure is shown on the run without turning any check red. Every failed
    # attempt keeps its trace, the first one too even when the retry passes, and the traces
    # are uploaded so the bead can read what happened (rq-4zhj).
    web-e2e-quarantine:
        needs: changes
        if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              continue-on-error: true
              run: bash ../.github/scripts/install-playwright.sh

            - name: Run quarantined E2E tests
              continue-on-error: true
              run: npx playwright test --grep @quarantine --pass-with-no-tests --trace retain-on-failure

            - name: Upload traces of failed quarantined tests
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: quarantine-traces
                  path: web/test-results/
                  if-no-files-found: ignore

    web-build:
        needs: changes
        if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

    container-smoke:
        needs: changes
        if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - name: Build production image for isolated smoke checks
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  platforms: linux/amd64
                  tags: retroquest:smoke
                  build-args: VCS_REF=${{ github.sha }}
                  cache-from: type=gha
                  # Exporting takes minutes, since the layers a commit invalidates are
                  # about 600 MB each, and only publish-image reads what this run writes.
                  # So it exports under that job's condition and nowhere else; every run
                  # still reads main's cache (rq-rm00).
                  cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
            - name: Verify production HTTP behavior
              env:
                  REVISION: ${{ github.sha }}
              run: python3 deploy/test_container.py retroquest:smoke --revision "$REVISION"

    publish-image:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [web-lint, web-typecheck, web-test, web-e2e, web-build, container-smoke]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and publish production image
              id: image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: ghcr.io/rmstdope/retroquest:sha-${{ github.sha }}
                  build-args: VCS_REF=${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/rmstdope/retroquest
                      org.opencontainers.image.revision=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Write deployment manifest
              env:
                  IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
                  REVISION: ${{ github.sha }}
              run: |
                  python3 - <<'PY'
                  import json
                  import os
                  from pathlib import Path
                  Path("deployment.json").write_text(json.dumps({
                      "revision": os.environ["REVISION"],
                      "images": {
                          "web": "ghcr.io/rmstdope/retroquest@" + os.environ["IMAGE_DIGEST"]
                      }
                  }) + "\n")
                  PY
            - name: Upload deployment manifest
              uses: actions/upload-artifact@v7
              with:
                  name: deployment-manifest
                  path: deployment.json
                  if-no-files-found: error
                  retention-days: 90
                  overwrite: true
            - name: Report immutable deployment reference
              env:
                  IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
                  REVISION: ${{ github.sha }}
              run: |
                  {
                    echo '## Manual deployment'
                    echo '```sh'
                    echo "rmstdope-deploy release retroquest --image ghcr.io/rmstdope/retroquest@${IMAGE_DIGEST} --revision ${REVISION}"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

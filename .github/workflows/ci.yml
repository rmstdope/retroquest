name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_call:

permissions:
    contents: read

jobs:
    web-lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npx eslint .

            - name: Format check
              run: npx prettier --check "src/**/*.{ts,vue}" "*.config.*"

    web-typecheck:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx vue-tsc --noEmit

    web-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test

    web-e2e:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run E2E tests
              run: npx playwright test

    web-build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

    container-smoke:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - name: Build production image for isolated smoke checks
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  platforms: linux/amd64
                  tags: retroquest:smoke
                  build-args: VCS_REF=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Verify production HTTP behavior
              env:
                  REVISION: ${{ github.sha }}
              run: python3 deploy/test_container.py retroquest:smoke --revision "$REVISION"

    publish-image:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [web-lint, web-typecheck, web-test, web-e2e, web-build, container-smoke]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and publish production image
              id: image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: ghcr.io/rmstdope/retroquest:sha-${{ github.sha }}
                  build-args: VCS_REF=${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/rmstdope/retroquest
                      org.opencontainers.image.revision=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Report immutable deployment reference
              env:
                  IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
                  REVISION: ${{ github.sha }}
              run: |
                  {
                    echo '## Manual deployment'
                    echo '```sh'
                    echo "rmstdope-deploy release retroquest --image ghcr.io/rmstdope/retroquest@${IMAGE_DIGEST} --revision ${REVISION}"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

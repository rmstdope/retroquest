<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>rq-mwz A</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces&family=Source+Serif+4&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px 16px;background:#0b0f13;color:#ece6d6;font-family:'DM Sans',system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px} .sub{color:#9aa4ad;margin:0 0 20px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:20px}
figure{margin:0;width:300px} figcaption{font-size:13px;font-weight:600;color:#ffb836;margin-bottom:8px}
.phone{background:#10151a;border:1px solid #34404b;border-radius:18px;height:520px;display:flex}
.inner{margin:auto;padding:28px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;box-sizing:border-box}
.kicker{font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#ffb836;padding:2px 4px;border-radius:3px}
.kicker.lit{text-shadow:0 0 14px #ffa914;background:#36270a}
.title{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:32px;line-height:1.05;margin:8px 0 0}
.title.lit{text-shadow:0 0 18px #ffa914} .title.held{visibility:hidden}
.orn{width:160px;margin:14px 0 18px;display:flex;align-items:center;gap:10px;font-size:9px;color:#ffa914} .orn span{flex:1;height:1px;background:#34404b}
.body{min-height:60px;width:100%;text-align:left;font-family:'Source Serif 4',Georgia,serif;font-size:15px;line-height:1.6;color:#d9d3c3}
.blk{margin:0;padding-left:8px} .blk.speaking{box-shadow:inset 2px 0 0 #ffa914}
.stats{display:flex;gap:16px;margin:14px 0} .stats div{display:flex;flex-direction:column} .stats b{font-family:Fraunces,serif;font-size:20px;font-weight:400} .stats small{font-size:9px;color:#9aa4ad;text-transform:uppercase;letter-spacing:.1em}
button{margin-top:auto;background:#ffa914;color:#10151a;border:0;border-radius:8px;padding:10px 18px;font:600 14px 'DM Sans',sans-serif}
.note{font-size:13px;color:#b8c0c8;line-height:1.45}
</style></head><body>
<h1>Option A — the act's name is lit while the heading is read</h1><p class="sub">The page that closes an act, Act II shown; Acts I, III and IV work the same way (Act IV's button says “Finish the game”).</p>
<div class="row"><figure><figcaption>1 · Recordings still loading</figcaption>
<div class="phone"><div class="inner">
<span class="kicker">Act II complete</span>
<h2 class="title held">The Gathering Storm</h2>
<div class="orn"><span></span>◆<span></span></div>
<div class="body"></div>
<div class="stats"><div><b>9 / 9</b><small>Quests completed</small></div><div><b>6</b><small>Spells known</small></div><div><b>23</b><small>Places visited</small></div></div>
<button>Continue to Act III</button>
</div></div><p class="note">The heading and text are held back (their room kept) until the voice is ready, as on the opening page. The line above, the numbers and the button are there at once.</p></figure><figure><figcaption>2 · Heading being read</figcaption>
<div class="phone"><div class="inner">
<span class="kicker">Act II complete</span>
<h2 class="title lit">The Gathering Storm</h2>
<div class="orn"><span></span>◆<span></span></div>
<div class="body"></div>
<div class="stats"><div><b>9 / 9</b><small>Quests completed</small></div><div><b>6</b><small>Spells known</small></div><div><b>23</b><small>Places visited</small></div></div>
<button>Continue to Act III</button>
</div></div><p class="note">The storyteller says <i>“Act Two complete. The Gathering Storm.”</i> Only the act's name glows, exactly as the opening page of an act does today.</p></figure><figure><figcaption>3 · A breath, then the first line</figcaption>
<div class="phone"><div class="inner">
<span class="kicker">Act II complete</span>
<h2 class="title">The Gathering Storm</h2>
<div class="orn"><span></span>◆<span></span></div>
<div class="body"><p class="blk speaking">Malakar is real. And the bloodline he seeks is yours.</p></div>
<div class="stats"><div><b>9 / 9</b><small>Quests completed</small></div><div><b>6</b><small>Spells known</small></div><div><b>23</b><small>Places visited</small></div></div>
<button>Continue to Act III</button>
</div></div><p class="note">After the same short pause the opening page uses, the closing line appears and is read, marked down its left edge.</p></figure><figure><figcaption>4 · Narration off</figcaption>
<div class="phone"><div class="inner">
<span class="kicker">Act II complete</span>
<h2 class="title">The Gathering Storm</h2>
<div class="orn"><span></span>◆<span></span></div>
<div class="body"><p class="blk">Malakar is real. And the bloodline he seeks is yours.</p></div>
<div class="stats"><div><b>9 / 9</b><small>Quests completed</small></div><div><b>6</b><small>Spells known</small></div><div><b>23</b><small>Places visited</small></div></div>
<button>Continue to Act III</button>
</div></div><p class="note">Nothing changes from today: everything shows at once and nothing is lit.</p></figure></div></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The road leads to the well</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Source+Serif+4:wght@400&family=DM+Sans:wght@500&display=swap" rel="stylesheet">
<style>:root{--bg:#10151a;--surface:#161d24;--raised:#1c242c;--line:#26313b;--fg:#ece6d6;--prose:#d9d3c3;--muted:#a39d8e;--accent:#ffa914;--item:#8fcf7a;--char:#e3a3d6;--room:#7fb8e6;--fail:#e07a6a}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;padding:16px}
h1{font-family:Fraunces,serif;font-size:22px;margin:0 0 4px}h2{font-family:Fraunces,serif;font-size:16px;margin:22px 0 8px;color:var(--accent)}
.note{color:var(--muted);font-size:14px;max-width:760px;line-height:1.5;margin:0 0 12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;max-width:1000px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:14px;font-family:'Source Serif 4',serif;color:var(--prose);font-size:15px;line-height:1.55}
.card .lbl{font-family:'DM Sans';font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
<h1>Round 2 — a lead for every task that can be missed</h1><p class="note">Chosen: the glint starts the well task (option B), every task that can be missed gets its own lead, and the well's lead uses the glint. Below: the lead for each task, then what happens when more than one is missing. A lead is used only for a task the player never started; a task they began and left open still gets “the tasks you began in the village”. Outlined text is new.</p>
<h2>1. The leads, one per task</h2><div class="row">
<div class="card"><div class="lbl">Magnet fishing (agreed)</div><p>Map: …unfinished: <span class="new">something still glints far down in the village <span class="i">well</span>.</span></p><p>Hint: …still holds you: <span class="new">far down in the <span class="i">well</span>, something still glints.</span></p></div>
<div class="card"><div class="lbl">Fishing expedition</div><p>Both: <span class="new">the <span class="c">fisherman</span> at the river bend still sits with an empty line.</span></p></div>
<div class="card"><div class="lbl">Let there be light</div><p>Both: <span class="new">the <span class="c">priest</span> in the chapel has not had his say.</span></p></div>
<div class="card"><div class="lbl">Oh deer, oh deer</div><p>Both: <span class="new"><span class="c">Borin</span> at the forge still has a story about the <span class="r">Hidden Glade</span> to tell.</span></p></div>
<div class="card"><div class="lbl">Curiosity killed the cat</div><p>Both: <span class="new">Old Man <span class="c">Hemlock</span> is still waiting for his cat.</span></p></div>
<div class="card"><div class="lbl">The faded photograph</div><p>Both: <span class="new">a drawer at home still holds something you have not seen.</span></p></div>
</div>
<h2>2a. More than one missing — the map names them all</h2><div class="row"><div class="card"><div class="lbl">Road to Greendale</div><p class="cmd">› use map</p><div class="fail">The map stays a plain map of Willowbrook. The hidden road will not show itself while something here is unfinished: the tasks you began in the village, <span class="new">the <span class="c">fisherman</span> at the river bend still sits with an empty line and something still glints far down in the village <span class="i">well</span>.</span></div></div><div class="card"><div class="lbl">Hint</div><p>The amulet is yours, but Willowbrook still holds you: something you began here is unfinished.</p><p class="note">The hint names one thing at a time: what was begun first, then the missed tasks in the order the act meets them.</p></div></div>
<h2>2b. More than one missing — the map names only the first</h2><div class="row"><div class="card"><div class="lbl">Road to Greendale</div><p class="cmd">› use map</p><div class="fail">…while something here is unfinished: <span class="new">the tasks you began in the village, and more besides.</span></div><p class="note">Shorter, but the player learns one thing per try.</p></div></div>
<h2>3. The quest log for the well</h2><div class="row"><div class="card"><div class="lbl">On seeing the glint</div><b>Magnet fishing expedition</b><p class="new">Something glints far down in the well, much too deep for hands.</p></div><div class="card"><div class="lbl">Once the magnet is on the rod</div><b>Magnet fishing expedition</b><p class="dim">Something glints far down in the well, much too deep for hands.</p><p class="new">The magnet might reach it, on a long enough rod.</p></div><div class="card"><div class="lbl">Done (unchanged)</div><p>The well gave up a silver ring, and something else besides.</p></div></div>
</body></html>

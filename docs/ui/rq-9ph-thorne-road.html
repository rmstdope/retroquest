<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Thorne's road: woven in</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces&family=JetBrains+Mono&family=Source+Serif+4:ital@0;1&display=swap');
:root{--bg:#10151a;--line2:#34404b;--fg:#ece6d6;--prose:#d9d3c3;--muted:#a39d8e;--accent:#ffa914;--char:#7fb0e6;--item:#8fcf7a;--at:#ffb836;--fail:#e8896b;--ok:#9fd69a}
*{box-sizing:border-box}body{margin:0;background:#0b0f12;color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;padding:24px}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;margin:0 0 4px}.lead{color:var(--muted);max-width:860px;margin:0 0 24px;line-height:1.5}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}.step{display:flex;flex-direction:column;gap:8px}
.cap{font-size:13px;color:var(--at);font-weight:600;letter-spacing:.04em}.note{font-size:12px;color:var(--muted);max-width:440px;line-height:1.45}
.frame{width:460px;max-width:100%;border:1px solid var(--line2);border-radius:12px;background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:10px}
.cmd{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.t{font-family:'Source Serif 4',Georgia,serif;color:var(--prose);margin:0;line-height:1.5}
.dq{margin:0;border-left:2px solid var(--char);padding-left:12px}.sp{font-size:12px;color:var(--char);font-weight:600;margin-bottom:2px}
.dq p{font-family:'Source Serif 4',Georgia,serif;font-style:italic;margin:0;line-height:1.5;color:var(--prose)}
.dim{opacity:.6}.new{color:var(--at);font-weight:700;font-style:normal;font-family:'DM Sans'}.c{color:var(--char)}.i{color:var(--item)}
<h1>Option A — woven into the line he already has</h1><p class=lead>Thorne already says the forest road was safe a month ago. This option rewrites that one line so it also says where the road runs and why it was safe. Three paragraphs, as today; nothing repeats.</p>
<div class=row><div class=step><div class=cap>First talk</div><div class=frame><div class=cmd>› talk to caravan master thorne</div><blockquote class='dq'><div class=sp>Caravan Master Thorne</div><p class='t dim'>Thank the gods, someone who looks capable! I desperately need help - one of my most valuable caravans has gone missing in the Enchanted Forest. … Would you be willing to search for them? I would be forever in your debt.</p></blockquote>
<blockquote class=dq><div class=sp>Caravan Master Thorne</div><p><span class=new>CHANGED</span> · Our road to Heavensforth runs along the forest's edge. It was safe enough a month ago, while the king's riders patrolled it. Nobody patrols it since the king went; every rider the castle has is out looking for him.</p></blockquote>
<p class='t gone' style='font-size:12px'>was: That forest road was safe enough a month ago. Nobody patrols it since the king went; every rider the castle has is out looking for him.</p>
<blockquote class='dq dim'><div class=sp>Caravan Master Thorne</div><p><span class=c>Brenn</span>, my guard, came stumbling back alone two nights ago. Says the ravine path gave way and he ran. Ran! I'll deal with him once my people are home.</p></blockquote></div><p class=note>Same three paragraphs as today. Only the middle one changes.</p></div><div class=step><div class=cap>Every later talk · and after the rescue</div><div class=frame><div class=cmd>› talk to thorne</div><p class='t dim'>Caravan Master Thorne: Any word on my missing caravan? …</p></div><p class=note>Unchanged. The road is only explained in the first talk.</p></div></div>

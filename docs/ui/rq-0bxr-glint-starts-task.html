<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The road leads to the well</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Source+Serif+4:wght@400&family=DM+Sans:wght@500&display=swap" rel="stylesheet">
<style>:root{--bg:#10151a;--surface:#161d24;--raised:#1c242c;--line:#26313b;--fg:#ece6d6;--prose:#d9d3c3;--muted:#a39d8e;--accent:#ffa914;--item:#8fcf7a;--char:#e3a3d6;--room:#7fb8e6;--fail:#e07a6a}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;padding:16px}
h1{font-family:Fraunces,serif;font-size:22px;margin:0 0 4px}h2{font-family:Fraunces,serif;font-size:16px;margin:22px 0 8px;color:var(--accent)}
.note{color:var(--muted);font-size:14px;max-width:760px;line-height:1.5;margin:0 0 12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;max-width:1000px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:14px;font-family:'Source Serif 4',serif;color:var(--prose);font-size:15px;line-height:1.55}
.card .lbl{font-family:'DM Sans';font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
<h1>Option B — the glint starts the task</h1><p class="note">Seeing the glint in the well (looking at the well while the ring is still down there) puts <i>Magnet fishing expedition</i> in the quest log at once, so it is listed long before the road. The map and hint lines from option A are still needed for a player who never looked into the well. Outlined text is new.</p>
<h2>1. Looking into the well, early in the act</h2><div class="row"><div class="card"><div class="lbl">Village Square</div><p class="cmd">› examine well</p><p>An old stone well, its surface worn smooth, its shaft disappearing into the depths. The water below is dark and still, and it smells sour, the way milk does when it has turned. Far down, something glints, or you think it does. It is much too deep to reach.</p><p class="new">New quest: Magnet fishing expedition</p></div><div class="card"><div class="lbl">Quest log</div><b class="new">Magnet fishing expedition</b><p class="new">Something glints far down in the well, much too deep for hands.</p></div></div>
<h2>2. Magnet joined to the rod</h2><div class="row"><div class="card"><div class="lbl">Quest log</div><b>Magnet fishing expedition</b><p class="dim">Something glints far down in the well, much too deep for hands.</p><p class="new">The magnet might reach it, on a long enough rod.</p></div></div>
<h2>3. At the road, the well still open</h2><div class="row"><div class="card"><div class="lbl">Road to Greendale</div><p class="cmd">› use map</p><div class="fail">The map stays a plain map of Willowbrook. The hidden road will not show itself while something here is unfinished: the tasks you began in the village.</div><p class="note">True now: the quest log lists the well.</p></div><div class="card"><div class="lbl">Hint</div><p>The amulet is yours, but Willowbrook still holds you: <span class="new">far down in the <span class="i">well</span>, something still glints.</span></p></div></div>
<h2>4. Never looked into the well at all</h2><div class="row"><div class="card"><div class="lbl">Road to Greendale</div><p class="cmd">› use map</p><div class="fail">…while something here is unfinished: <span class="new">something still glints far down in the village <span class="i">well</span>.</span></div><p class="note">Same as option A. Rare: the story sends the player to the well before Mira.</p></div></div>
</body></html>

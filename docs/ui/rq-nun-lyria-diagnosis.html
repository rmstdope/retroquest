<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Elena cure flow</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces&family=JetBrains+Mono&family=Source+Serif+4:ital@0;1&display=swap');
:root{--bg:#10151a;--line2:#34404b;--fg:#ece6d6;--prose:#d9d3c3;--muted:#a39d8e;--accent:#ffa914;--char:#7fb0e6;--item:#8fcf7a;--at:#ffb836;--fail:#e8896b;--ok:#9fd69a}
*{box-sizing:border-box}body{margin:0;background:#0b0f12;color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;padding:24px}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;margin:0 0 4px}.lead{color:var(--muted);max-width:860px;margin:0 0 24px;line-height:1.5}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}.step{display:flex;flex-direction:column;gap:8px}
.cap{font-size:13px;color:var(--at);font-weight:600;letter-spacing:.04em}.note{font-size:12px;color:var(--muted);max-width:440px;line-height:1.45}
.frame{width:460px;max-width:100%;border:1px solid var(--line2);border-radius:12px;background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:10px}
.frame.phone{width:320px;border-radius:24px}
.cmd{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
<h1>Option A — Elena mentions Lyria on every talk until the water</h1><p class=lead>The whole scene in play order, with every new line. Elena keeps naming Lyria on each talk between the healing and the water.</p><div class=row><div class=step><div class=cap>1 · Elena, first talk</div><div class='frame'><div class=cmd>› talk to barmaid elena</div><blockquote class=dq><div class=sp>Barmaid Elena</div><p class=dim>Hello, traveler. I apologize for my appearance… <span class=dim>(word for word as today)</span></p></blockquote></div></div><div class=step><div class=cap>1 · First talk once the curse is known</div><div class='frame'><div class=cmd>› talk to master healer lyria   (first time once Elena's curse is known)</div><p class='t dim'><b style='color:#ffb836'>NEW</b> · Lyria looks up from her mortar, and something in your face makes her set the pestle down.</p><blockquote class=dq><div class=sp>Master Healer Lyria</div><p><b style='color:#ffb836'>NEW</b> · You've been to the Silver Stag. Marcus's girl, Elena. I have sat by her bed myself, and I could do nothing for her. Listen, then, because this is how a curse like hers is lifted, if it can be lifted at all. First she must be made strong, or what comes after will kill her; that wants a deeper healing than I can give alone. Then the mark must be washed in water no shadow has ever touched. You will find none in this city; every well here has seen the dark. And last, the thing must be unbound. Not broken: unbound, with the old kind of unbinding, the kind the scholars wrote down before any of us were born.</p></blockquote><blockquote class=dq><div class=sp>Master Healer Lyria</div><p class=dim>Welcome to my house of healing. I can sense magical potential in you, but I desperately need help. … <span class=dim>(her usual reply for where you are, word for word)</span></p></blockquote></div><p class=note>Happens once: the first time you talk to her after Elena has told you of the curse, or after your first healing of Elena failed to take, whichever comes first. Her usual reply follows, unchanged.</p></div><div class=step><div class=cap>2 · Lyria, every later talk until Elena is cured</div><div class='frame'><div class=cmd>› talk to master healer lyria</div><blockquote class=dq><div class=sp>Master Healer Lyria</div><p><b style='color:#ffb836'>NEW</b> · Elena still? Strengthen her, wash her in untouched water, then unbind it. In that order, or not at all.</p></blockquote><blockquote class=dq><div class=sp>Master Healer Lyria</div><p class=dim>Welcome to my house of healing. I can sense magical potential in you, but I desperately need help. … <span class=dim>(her usual reply for where you are, word for word)</span></p></blockquote></div></div><div class=step><div class=cap>3 · The healing</div><div class='frame'><div class=cmd>› cast greater_heal on barmaid elena</div><p class='t dim'>You cast greater heal on Elena … she stands a little straighter. <span class=dim>(word for word)</span></p><p class='t'><b style='color:#ffb836'>NEW</b> · The healing has made her stronger, but the curse still clings to her.</p><p class='t dim'>As the golden light fades, something surfaces on the inside of Elena's wrist… <span class=dim>(the silver mask, word for word)</span></p></div></div><div class=step><div class=cap>4 · Elena, first talk after the healing</div><div class='frame'><div class=cmd>› talk to barmaid elena   (first talk after the healing)</div><p class='t dim'>Elena sees you looking at her wrist… <span class=dim>(the mask aside, word for word)</span></p><p class='t dim'><b style='color:#ffb836'>NEW</b> · Elena turns her hand over and looks at it as if it belonged to someone else.</p><blockquote class=dq><div class=sp>Barmaid Elena</div><p><b style='color:#ffb836'>NEW</b> · It didn't take. I felt it go in, warm as a hearth, and then the cold closed over it again.</p></blockquote><blockquote class=dq><div class=sp>Barmaid Elena</div><p><b style='color:#ffb836'>NEW</b> · Master Lyria sat with me once, when it began. If anyone knows what comes next, she does.</p></blockquote></div></div><div class=step><div class=cap>5 · Elena, later talks before the water</div><div class='frame'><div class=cmd>› talk to barmaid elena   (later talks, before the water)</div><p class='t dim'><b style='color:#ffb836'>NEW</b> · Elena turns her hand over and looks at it as if it belonged to someone else.</p><blockquote class=dq><div class=sp>Barmaid Elena</div><p><b style='color:#ffb836'>NEW</b> · It didn't take. I felt it go in, warm as a hearth, and then the cold closed over it again.</p></blockquote><blockquote class=dq><div class=sp>Barmaid Elena</div><p><b style='color:#ffb836'>NEW</b> · Master Lyria sat with me once, when it began. If anyone knows what comes next, she does.</p></blockquote></div><p class=note>She mentions Lyria every time, so a player who missed it the first time still hears it.</p></div><div class=step><div class=cap>6 · The water</div><div class='frame'><div class=cmd>› use crystal-clear water with barmaid elena</div><p class='t dim'>You carefully pour the crystal-clear water over Elena … greatly weakened by the purification. <span class=dim>(word for word; the last sentence goes)</span></p></div></div><div class=step><div class=cap>7 · Elena, after the water</div><div class='frame'><div class=cmd>› talk to barmaid elena</div><p class='t dim'><b style='color:#ffb836'>NEW</b> · Elena rubs at the inside of her wrist.</p><blockquote class=dq><div class=sp>Barmaid Elena</div><p><b style='color:#ffb836'>NEW</b> · The water stung, and then it was gone, and some of the cold went with it. But it is still holding on. I can feel it, here.</p></blockquote></div></div><div class=step><div class=cap>8 · The dispel, and after</div><div class='frame'><div class=cmd>› cast dispel on barmaid elena</div><p class='t dim'>… <span class=dim>(word for word as today; Elena's cured line too)</span></p></div></div><div class=step><div class=cap>Save and reload</div><div class='frame'><p class='ex'>A reload at any point puts every line above back in the state it was in: whether Lyria has told you yet, whether Elena has been healed or washed.</p></div></div></div>
